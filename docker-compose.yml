name: alarm-filter

# worker / web / backup are added in later phases (CLAUDE.md §4).
# Secrets come from .env (gitignored); see .env.example.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-alarms}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [internal]
    # Not published on purpose — only `web` is exposed (see docker-compose.dev.yml for local access).

  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-alarm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-alarms}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
